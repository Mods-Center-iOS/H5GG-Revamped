name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          ref: master
          submodules: recursive

      - name: Setup Theos (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "THEOS=$PWD/theos" >> $GITHUB_ENV
          brew install ldid xz
          # Use the iOS SDK targeted by the project Makefiles.
          curl -fL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o sdk.tar.xz
          mkdir -p "$PWD/theos/sdks"
          tar xf sdk.tar.xz -C "$PWD/theos/sdks"
          rm sdk.tar.xz

      - name: Setup Theos (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "THEOS=$PWD/theos" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl xz-utils fakeroot clang llvm lld
          # Download Linux toolchain
          curl -fL https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu20.04.tar.xz -o tc.tar.xz
          mkdir -p "$PWD/theos/toolchain"
          tar xf tc.tar.xz -C "$PWD/theos/toolchain"
          rm tc.tar.xz
          # Download SDK
          curl -fL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o sdk.tar.xz
          mkdir -p "$PWD/theos/sdks"
          tar xf sdk.tar.xz -C "$PWD/theos/sdks"
          rm sdk.tar.xz

      - name: Build
        run: make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: H5GG-deb-${{ matrix.os }}
          path: packages/*.deb
